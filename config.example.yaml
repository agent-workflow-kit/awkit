# Example config for awkit. Location: ~/.config/awkit/config.yaml
# Drop-ins: ~/.config/awkit/config.d/*.yaml (lexical order, maps merged, lists replaced).
# The config, drop-ins, the adapter overlay (~/.config/awkit/adapters/) and their parent
# directories must be owned by you, not symlinks, and not group- or world-writable.
# Unknown keys are refused. There are no repos: or hooks: keys in 0.x.
# `awkit validate` checks this file against schemas/config.json without running any tool.

me:
  # The <user> of human:<user>. Default: the OS user name (null = use the default).
  name: null
  # Account names; passed to tools only where an adapter says so. Default: none.
  github: null
  gitlab: null
  jira: null

# Role to tool. Default: none. Example entries:
#   githost: forgectl
#   tickets: ticketctl
#   notify: notice-route
roles: {}

# Per-tool switches, keyed by tool name. Default: none (every registered tool is enabled).
# Example entry:
#   forgectl:
#     enabled: true   # default true; a disabled tool is skipped everywhere
#     bin: null       # default none; an absolute path overrides the adapter's program name
tools: {}

dashboard:
  # The refresh interval; at least 5s. Env: AWKIT_DASHBOARD__REFRESH.
  refresh: 15s
  # The most concurrent reads, 1 to 16. Env: AWKIT_DASHBOARD__CONCURRENCY.
  concurrency: 8
  # The default read timeout. Env: AWKIT_DASHBOARD__READ_TIMEOUT.
  read_timeout: 10s

cron:
  # A user-owned file (mode 0600) that the cron lines source. Default: none.
  env_file: null
  # Absolute directories added to the cron PATH (no colon in a path). Default: [].
  path_extra: []
  # Override an entry's schedule per tool with a cron expression or one of the entry's
  # accepted shorthands. Default: the adapter's schedule. Example entries:
  #   agent-spawn: "*/10 * * * *"
  intervals: {}

doctor:
  # The timeout of one probe (doctor --probe).
  probe_timeout: 60s
